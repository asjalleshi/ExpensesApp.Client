<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <header class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
            <h1 class="h3 mb-0">Expense Tracker</h1>
            <nav>
                <a href="index.html" class="btn btn-outline-primary btn-sm">Home</a>
                <a href="add.html" class="btn btn-outline-primary btn-sm">Add Expense</a>
                <a href="expenses.html" class="btn btn-primary btn-sm">Expenses List</a>
            </nav>
        </header>

        <h3 class="mb-3">All Expenses</h3>
        <div class="table-responsive">
            <table class="table table-striped table-hover bg-white shadow-sm rounded">
                <thead class="table-dark">
                    <tr>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Amount</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="expensesTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tableBody = document.getElementById('expensesTableBody');
            const expenses = JSON.parse(localStorage.getItem('expenses')) || [];

            if (expenses.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="4" class="text-center">No expenses found.</td></tr>';
                return;
            }

            tableBody.innerHTML = expenses.map(exp => `
                <tr>
                    <td>${exp.title}</td>
                    <td><span class="badge bg-secondary">${exp.category}</span></td>
                    <td>$${Number(exp.amount).toFixed(2)}</td>
                    <td>${exp.date}</td>
                </tr>
            `).join('');
        });
    </script>
</body>
</html>
